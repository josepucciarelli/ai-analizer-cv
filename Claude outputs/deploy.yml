# Compila la app en cada push a "maingit" y publica build/client en la rama "deploy".
# Hostinger (Git deploy) se conecta a la rama "deploy" y la copia a public_html.
name: Build y deploy

on:
  push:
    branches: [maingit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publicar build/client en la rama deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./build/client
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
